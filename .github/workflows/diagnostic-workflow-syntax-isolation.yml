name: Diagnostic workflow syntax isolation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnostic-workflow-syntax-isolation.yml'

permissions:
  contents: read

jobs:
  syntax-isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow parsed and job started
        run: |
          echo "workflow parsed"
          node --version
