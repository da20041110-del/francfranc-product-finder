name: Build official product catalog (test)

on:
  push:
    paths:
      - 'scripts/build-catalog.mjs'
      - '.github/workflows/build-catalog-test.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of product pages to test (validate 100 next)"
        required: true
        default: "100"
        type: string

permissions:
  contents: read

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch a small sample from the official site
        run: node scripts/build-catalog.mjs --limit=${{ inputs.limit || '100' }}
      - name: Print catalog sample for verification
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('catalog.json','utf8')); console.log(JSON.stringify({attempted:c.attempted,found:c.found,products:c.products.map(p=>({title:p.title,price:p.price,imagePresent:Boolean(p.image),url:p.url,itemCode:p.itemCode,verifiedCode:p.verifiedCode}))},null,2))"
      - name: Save catalog as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: francfranc-catalog-test
          path: catalog.json
          if-no-files-found: warn
          retention-days: 7
