name: Prepare isolated live test preview

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: francfranc-test-preview
  cancel-in-progress: false

jobs:
  prepare-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production app source without changing it
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the verified test-only catalog artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44876987771 --repo "${GITHUB_REPOSITORY}" \
            --name francfranc-verified-catalog-additions-test \
            --dir testdata

      - name: Assemble isolated preview under /test/
        run: |
          mkdir -p test
          cp testdata/catalog.json test/catalog.json
          cp testdata/image-features.json test/image-features.json
          cp index.html test/index.html
          cp apple-touch-icon.png test/apple-touch-icon.png
          python - <<'PY'
          from pathlib import Path
          p = Path("test/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace('<title>Francfranc 商品検索</title>', '<title>【テスト版】Francfranc 商品検索</title>')
          s = s.replace('href="./apple-touch-icon.png?v=2"', 'href="./apple-touch-icon.png?v=test1"')
          s = s.replace('href="./apple-touch-icon.png?v=2"', 'href="./apple-touch-icon.png?v=test1"')
          banner = """<div style="position:sticky;top:0;z-index:2000;background:#8b4d42;color:#fff;text-align:center;padding:10px 12px;font-size:13px;font-weight:700">テスト専用版 ｜ 本番データ・本番アプリには影響しません</div>"""
          s = s.replace("<body>", "<body>\n" + banner, 1)
          p.write_text(s, encoding="utf-8")
          PY
          test -s test/catalog.json
          test -s test/image-features.json
          test -s test/index.html
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('test/catalog.json','utf8'));
          const f=JSON.parse(fs.readFileSync('test/image-features.json','utf8'));
          if(!Array.isArray(c.products)||!c.products.length) throw new Error('catalog missing products');
          if(!f.features||!Object.keys(f.features).length) throw new Error('image features missing');
          console.log('Preview catalog:',c.products.length,'products; image features:',Object.keys(f.features).length);
          NODE

      - name: Publish only the isolated /test/ folder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/index.html test/catalog.json test/image-features.json test/apple-touch-icon.png
          git commit -m "Add isolated Francfranc test preview"
          git push origin HEAD:main
