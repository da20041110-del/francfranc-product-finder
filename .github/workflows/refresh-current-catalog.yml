name: Refresh current Francfranc catalog

on:
  # Automatically run a small catalog test after scraper/workflow changes.
  push:
    paths:
      - 'scripts/build-catalog.mjs'
      - '.github/workflows/refresh-current-catalog.yml'
  schedule:
    - cron: '23 18 * * *' # 03:23 JST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-francfranc-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch a small test catalog after code changes
        if: github.event_name == 'push'
        run: node scripts/build-catalog.mjs --limit=1000
      - name: Fetch all products for scheduled or manual refresh
        if: github.event_name != 'push'
        run: node scripts/build-catalog.mjs --all
      - name: Summarize catalog
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('catalog.json','utf8')); console.log(JSON.stringify({generatedAt:c.generatedAt,attempted:c.attempted,found:c.found,withItemCode:c.products.filter(p=>p.itemCode).length,withImage:c.products.filter(p=>p.image).length},null,2))"
      - name: Publish refreshed catalog to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged; no commit needed."
          else
            git commit -m "Refresh current official product catalog"
            # Other app/workflow changes may land while scraping takes place.
            # Rebase the generated catalog commit before pushing to avoid a race.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
