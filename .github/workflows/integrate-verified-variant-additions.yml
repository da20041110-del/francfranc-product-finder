name: Integrate verified Francfranc variant additions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-verified-variant-additions.yml"

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: francfranc-variant-integration
  cancel-in-progress: false

jobs:
  prepare-data-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download previously validated candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: francfranc-original-variant-revalidation-test
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 45281717803

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge candidates and validate data consistency
        run: node scripts/merge-verified-variant-additions.mjs

      - name: Create isolated data-only pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: catalog/verified-variant-additions-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add catalog.json image-features.json variant-additions-merge-report.json
          git diff --cached --check
          git commit -m "Add verified Francfranc product variants"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Add 2,868 verified Francfranc product variants" \
            --body "Automated data-only integration from validation run 45281717803. Includes catalog.json, image-features.json, and a merge validation report. Strict checks enforce official 13-digit code agreement, HTTPS Francfranc image URLs, positive prices, unique codes, and image-feature coverage."
