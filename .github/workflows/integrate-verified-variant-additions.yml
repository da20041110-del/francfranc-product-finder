name: Preserve verified Francfranc variant additions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-verified-variant-additions.yml"

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: francfranc-variant-preservation
  cancel-in-progress: false

jobs:
  preserve-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: francfranc-original-variant-revalidation-test
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 45281717803

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate every candidate and its image features
        run: node scripts/merge-verified-variant-additions.mjs

      - name: Store validated source data in the repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: catalog/durable-verified-additions-data-${{ github.run_id }}
        run: |
          mkdir -p data/verified-variant-additions
          cp candidate/catalog-additions.json data/verified-variant-additions/catalog-additions.json
          cp candidate/image-features.json data/verified-variant-additions/image-features.json
          cp candidate/variant-catalog-additions-report.json data/verified-variant-additions/validation-report.json
          git checkout -- catalog.json image-features.json
          rm -f variant-additions-merge-report.json
          git switch -c "$BRANCH"
          git add data/verified-variant-additions
          git diff --cached --check
          git commit -m "Preserve verified Francfranc variant source data"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Preserve 2,868 verified Francfranc product additions" \
            --body "Durable source-data archive from validation run 45281717803. This PR stores the 2,868 validated product records, reusable image features, and validation report under data/verified-variant-additions. It does not change the live catalog. The daily catalog refresh will merge this archive only after the storage and refresh changes are merged."
