name: Verified catalog artifact download test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verified-artifact-download-test.yml'

permissions:
  contents: read
  actions: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download previously validated artifact
        uses: actions/download-artifact@v4
        with:
          name: francfranc-original-variant-revalidation-test
          path: source-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 45281717803
      - name: Verify artifact files and product count
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const a=JSON.parse(fs.readFileSync('source-artifact/catalog-additions.json','utf8')); const f=JSON.parse(fs.readFileSync('source-artifact/image-features.json','utf8')); if(!Array.isArray(a.products)||a.products.length!==2868) throw new Error('Unexpected product count'); if(!f.features||Object.keys(f.features).length<2868) throw new Error('Feature file incomplete'); console.log(JSON.stringify({products:a.products.length,featureVectors:Object.keys(f.features).length},null,2));"
