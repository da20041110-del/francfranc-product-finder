name: Audit product color and size variants (test only)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of ambiguous catalog pages to inspect"
        required: true
        default: "500"
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run official-page variant audit
        env:
          AUDIT_LIMIT: ${{ inputs.limit }}
          AUDIT_DELAY_MS: "900"
        run: node scripts/audit-variants-test.mjs
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: francfranc-variant-audit-test
          path: test/variant-audit.json
          if-no-files-found: error
          retention-days: 14
