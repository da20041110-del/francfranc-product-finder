```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Francfranc 商品検索</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f6f4;color:#333;font-family:Arial,"Noto Sans JP",sans-serif}
header{background:#fff;padding:20px;text-align:center;border-bottom:1px solid #e5e0dc}
header h1{font-size:22px;letter-spacing:2px;margin:0}
header p{font-size:12px;color:#777;margin:7px 0 0}
main{max-width:520px;margin:auto;padding:20px}
h2{font-size:18px}
.note{font-size:13px;color:#666;line-height:1.7}
.upload{display:block;background:white;border:2px dashed #c9bdb5;border-radius:14px;padding:24px;text-align:center;cursor:pointer}
.upload strong{display:block;margin-bottom:8px}
#photo{width:100%;margin-top:16px;border-radius:10px;display:none;max-height:320px;object-fit:contain;background:#eee}
button{width:100%;border:0;border-radius:10px;padding:15px;margin-top:14px;background:#333;color:white;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}
.card{background:white;border-radius:14px;padding:18px;margin-top:22px}
.tag{font-size:12px;color:#777}
.price{font-size:27px;font-weight:bold;margin:12px 0}
.barcode{display:block;margin:16px auto 6px;width:100%;max-width:320px;height:90px}
#result{display:none}
input[type=text]{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin-top:8px}
footer{text-align:center;font-size:11px;color:#888;padding:25px}
</style>
</head>
<body>
<header>
<h1>Francfranc</h1>
<p>PRODUCT FINDER · 社内業務用 試作版</p>
</header>
<main>
<h2>商品を写真から検索</h2>
<p class="note">店頭の商品を撮影、または写真を選択してください。</p>
<label class="upload" for="file">
<strong>📷 商品写真を選ぶ</strong>
<span class="note">カメラ撮影・写真ライブラリに対応</span>
</label>
<input id="file" type="file" accept="image/*" capture="environment" hidden>
<img id="photo" alt="撮影した商品写真">
<button id="search" disabled>商品を検索する</button>
<p class="note">※現在は画面の動作確認用です。AIによる商品特定はまだ接続されていません。</p>

<section class="card" id="result">
<span class="tag">商品情報サンプル · 実在商品ではありません</span>
<h2>サンプル商品</h2>
<p class="note">この欄に特定した商品の情報を表示します。</p>
<div class="price">価格未取得</div>
<p>JANコード：未取得</p>
<svg class="barcode" id="barcode" viewBox="0 0 300 90" role="img" aria-label="JANバーコード未設定"></svg>
<p class="note">正しい商品情報とJANコードが接続されるまで、バーコードは表示しません。</p>
<button id="official" style="display:none">公式サイトの商品ページを見る</button>
</section>
</main>
<footer>社内利用を想定した試作画面</footer>
<script>
const file=document.getElementById('file');
const photo=document.getElementById('photo');
const search=document.getElementById('search');
file.addEventListener('change',()=>{
  const f=file.files[0];
  if(!f)return;
  if(photo.dataset.url)URL.revokeObjectURL(photo.dataset.url);
  const url=URL.createObjectURL(f);
  photo.dataset.url=url;
  photo.src=url;
  photo.style.display='block';
  search.disabled=false;
  document.getElementById('result').style.display='none';
});
search.addEventListener('click',()=>{
  document.getElementById('result').style.display='block';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
});
</script>
</body>
</html>
```
