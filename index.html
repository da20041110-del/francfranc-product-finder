<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Francfranc 商品検索</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f6f4;color:#333;font-family:Arial,"Noto Sans JP",sans-serif}
header{background:#fff;padding:20px;text-align:center;border-bottom:1px solid #e5e0dc}
header h1{font-size:22px;letter-spacing:2px;margin:0}
header p{font-size:12px;color:#777;margin:7px 0 0}
main{max-width:520px;margin:auto;padding:20px}
h2{font-size:18px}
.note{font-size:13px;color:#666;line-height:1.7}
.upload{display:block;background:white;border:2px dashed #c9bdb5;border-radius:14px;padding:24px;text-align:center;cursor:pointer}
.upload strong{display:block;margin-bottom:8px}
#photo{width:100%;margin-top:16px;border-radius:10px;display:none;max-height:320px;object-fit:contain;background:#eee}
button{width:100%;border:0;border-radius:10px;padding:15px;margin-top:14px;background:#333;color:white;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}
.card{background:white;border-radius:14px;padding:18px;margin-top:22px}
input[type=text]{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;margin-top:8px;font-size:16px}
.barcode{display:block;margin:16px auto 6px;width:100%;max-width:340px;height:110px}
.status{padding:12px;border-radius:8px;background:#f0ede9;font-size:13px;line-height:1.7;margin-top:14px}
.status.error{background:#fff0ee;color:#9b2d20}
footer{text-align:center;font-size:11px;color:#888;padding:25px}
</style>
</head>
<body>
<header>
<h1>Francfranc</h1>
<p>PRODUCT FINDER · 社内業務用 試作版</p>
</header>
<main>
<h2>商品を写真から検索</h2>
<p class="note">店頭の商品を撮影、または写真を選択してください。</p>
<label class="upload" for="file">
<strong>📷 商品写真を選ぶ</strong>
<span class="note">カメラ撮影・写真ライブラリに対応</span>
</label>
<input id="file" type="file" accept="image/*" capture="environment" hidden>
<img id="photo" alt="撮影した商品写真">
<button id="search" disabled>商品を検索する</button>
<div class="status" id="photoStatus" role="status">写真検索のAIはまだ未接続です。現在は写真の選択・表示を確認できます。</div>

<section class="card">
<h2>バーコード表示テスト</h2>
<p class="note">公式商品ページの「品番」にある13桁の数字を入力すると、EAN-13バーコードを生成します。数字が未確認の商品では使わないでください。</p>
<label for="jan">品番（13桁）</label>
<input id="jan" type="text" inputmode="numeric" autocomplete="off" maxlength="13" placeholder="例：4901234567894">
<div class="status" id="barcodeStatus" role="status">品番を入力すると、チェックデジットを確認してバーコードを表示します。</div>
<svg class="barcode" id="barcode" viewBox="0 0 320 110" role="img" aria-label="バーコードは未生成です"></svg>
</section>
</main>
<footer>社内利用を想定した試作画面 · 未確認コードでのレジ処理は禁止</footer>
<script>
const file=document.getElementById('file');
const photo=document.getElementById('photo');
const search=document.getElementById('search');
const photoStatus=document.getElementById('photoStatus');
file.addEventListener('change',()=>{
  const f=file.files[0];
  if(!f)return;
  if(photo.dataset.url)URL.revokeObjectURL(photo.dataset.url);
  const url=URL.createObjectURL(f);
  photo.dataset.url=url;
  photo.src=url;
  photo.style.display='block';
  search.disabled=false;
  photoStatus.textContent='写真を読み込みました。写真検索のAIはまだ未接続のため、商品名の特定はできません。';
});
search.addEventListener('click',()=>{
  photoStatus.textContent='写真の表示は確認できましたが、商品データとの照合機能はまだありません。次の開発段階で商品画像カタログと検索処理を接続します。';
});
const jan=document.getElementById('jan');
const svg=document.getElementById('barcode');
const barcodeStatus=document.getElementById('barcodeStatus');
const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const PARITY=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function validJan(s){
  if(!/^\d{13}$/.test(s))return false;
  let sum=0;
  for(let i=0;i<12;i++)sum+=Number(s[i])*(i%2===0?1:3);
  return (10-sum%10)%10===Number(s[12]);
}
function drawBarcode(s){
  const digits=[...s].map(Number), parity=PARITY[digits[0]];
  let bits='101';
  for(let i=1;i<=6;i++)bits+=(parity[i-1]==='L'?L[digits[i]]:G[digits[i]]);
  bits+='01010';
  for(let i=7;i<=12;i++)bits+=R[digits[i]];
  bits+='101';
  const x0=20, module=2.15, top=10, h=70, guardH=80;
  let out='';
  for(let i=0;i<bits.length;i++){
    if(bits[i]==='1'){
      const guard=(i<3)||(i>=45&&i<50)||(i>=92);
      out+=`<rect x="${x0+i*module}" y="${top}" width="${module}" height="${guard?guardH:h}" fill="#111"/>`;
    }
  }
  out+=`<text x="10" y="103" font-size="12" fill="#111">${s[0]}</text>`;
  for(let i=1;i<=6;i++)out+=`<text x="${x0+(3+(i-1)*7+3.5)*module}" y="96" text-anchor="middle" font-size="12" fill="#111">${s[i]}</text>`;
  for(let i=7;i<=12;i++)out+=`<text x="${x0+(50+(i-7)*7+3.5)*module}" y="96" text-anchor="middle" font-size="12" fill="#111">${s[i]}</text>`;
  svg.innerHTML=out;
  svg.setAttribute('aria-label','EAN-13バーコード '+s);
}
jan.addEventListener('input',()=>{
  const s=jan.value.replace(/\D/g,'').slice(0,13);
  if(jan.value!==s)jan.value=s;
  svg.innerHTML='';
  if(!s){barcodeStatus.className='status';barcodeStatus.textContent='品番を入力すると、チェックデジットを確認してバーコードを表示します。';svg.setAttribute('aria-label','バーコードは未生成です');return;}
  if(s.length!==13){barcodeStatus.className='status error';barcodeStatus.textContent='13桁入力してください（現在 '+s.length+' 桁）。';return;}
  if(!validJan(s)){barcodeStatus.className='status error';barcodeStatus.textContent='チェックデジットが一致しません。品番を公式商品ページで再確認してください。';return;}
  drawBarcode(s);
  barcodeStatus.className='status';barcodeStatus.textContent='形式チェックOK。これは入力した数字から生成したバーコードです。実際の商品と一致することを確認してから使用してください。';
});
</script>
</body>
</html>
